scan:
  suffixes:
    - S
    - in
    - vers
ignore:
  pattern:
    - AUTHORS
    - NEWS
    - README
    - ChangeLog
    - ChangeLog-2011
    - INSTALL
    - THANKS
    - TODO
    - INSTALL
    - doc/DCO
    - configure
    - m4/Makefile.in
    - LICENSES
    - doc/HACKING
  suffixes:
    - info
    - info-1
    - info-2
    - info-3
    - info-4
    - swp
